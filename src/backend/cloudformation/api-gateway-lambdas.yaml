AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM template for TaskFlow API Gateway and Lambda functions.

Resources:
  # DynamoDB Tables (moved to the top)
  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: profiles
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH # Partition Key
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH # Partition Key for GSI
          Projection:
            ProjectionType: ALL # Project all attributes into the index
          ProvisionedThroughput: # Required for GSI even with PAY_PER_REQUEST table
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1

  # Table for tasks
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tasks
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: start_date
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH # Partition Key
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: UserIdAndStartDateIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH # Partition Key for GSI
            - AttributeName: start_date
              KeyType: RANGE # Sort Key for GSI
          Projection:
            ProjectionType: ALL # Project all attributes into the index
          ProvisionedThroughput: # Required for GSI even with PAY_PER_REQUEST table
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1

  # Table for stacks (communities)
  StackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: stack
      AttributeDefinitions:
        - AttributeName: value
          AttributeType: S
      KeySchema:
        - AttributeName: value
          KeyType: HASH # Partition Key
      BillingMode: PAY_PER_REQUEST

  # Table for event types
  EventTypeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: event_type
      AttributeDefinitions:
        - AttributeName: value
          AttributeType: S
      KeySchema:
        - AttributeName: value
          KeyType: HASH # Partition Key
      BillingMode: PAY_PER_REQUEST

  # IAM Role for Lambda functions to access DynamoDB (now defined after tables)
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole # For CloudWatch Logs
      Policies:
        - PolicyName: DynamoDBAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt ProfilesTable.Arn
                  - !GetAtt TasksTable.Arn
                  - !GetAtt StackTable.Arn
                  - !GetAtt EventTypeTable.Arn
                  - !Join ['', [!GetAtt ProfilesTable.Arn, '/index/*']] # For GSIs
                  - !Join ['', [!GetAtt TasksTable.Arn, '/index/*']] # For GSIs
      Path: /

  # Lambda Function to get all tasks
  GetTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowGetTasks
      Handler: index.getTasksController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks
            Method: get
          Cors: "'*'"

  # Lambda Function to create a task
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowCreateTask
      Handler: index.createTaskController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks
            Method: post
          Cors: "'*'"

  # Lambda Function to update a task
  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowUpdateTask
      Handler: index.updateTaskController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks/{id}
            Method: put
          Cors: "'*'"

  # Lambda Function to delete a task
  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowDeleteTask
      Handler: index.deleteTaskController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks/{id}
            Method: delete
          Cors: "'*'"

  # Lambda Function to get all stacks
  GetStacksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowGetStacks
      Handler: index.getStacksController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks
            Method: get
          Cors: "'*'"

  # Lambda Function to create a stack
  CreateStackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowCreateStack
      Handler: index.createStackController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks
            Method: post
          Cors: "'*'"

  # Lambda Function to update a stack
  UpdateStackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowUpdateStack
      Handler: index.updateStackController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks/{value}
            Method: put
          Cors: "'*'"

  # Lambda Function to delete a stack
  DeleteStackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowDeleteStack
      Handler: index.deleteStackController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks/{value}
            Method: delete
          Cors: "'*'"

  # Lambda Function to get all event types
  GetEventTypesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowGetEventTypes
      Handler: index.getEventTypeController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types
            Method: get
          Cors: "'*'"

  # Lambda Function to create an event type
  CreateEventTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowCreateEventType
      Handler: index.createEventTypeController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types
            Method: post
          Cors: "'*'"

  # Lambda Function to update an event type
  UpdateEventTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowUpdateEventType
      Handler: index.updateEventTypeController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types/{value}
            Method: put
          Cors: "'*'"

  # Lambda Function to delete an event type
  DeleteEventTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowDeleteEventType
      Handler: index.deleteEventTypeController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://sam/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types/{value}
            Method: delete
          Cors: "'*'"

Outputs:
  ApiGatewayInvokeURL:
    Description: "Invoke URL for the TaskFlow API"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"