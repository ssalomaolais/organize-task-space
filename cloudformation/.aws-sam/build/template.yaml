AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM template for TaskFlow API Gateway and Lambda functions.
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DynamoDBAccessPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
            Resource:
            - Fn::GetAtt:
              - ProfilesTable
              - Arn
            - Fn::GetAtt:
              - TasksTable
              - Arn
            - Fn::GetAtt:
              - StackTable
              - Arn
            - Fn::GetAtt:
              - EventTypeTable
              - Arn
            - Fn::Join:
              - ''
              - - Fn::GetAtt:
                  - ProfilesTable
                  - Arn
                - /index/*
            - Fn::Join:
              - ''
              - - Fn::GetAtt:
                  - TasksTable
                  - Arn
                - /index/*
      Path: /
  GetTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowGetTasks
      Handler: index.getTasksController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks
            Method: get
            Cors: '''*'''
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowCreateTask
      Handler: index.createTaskController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks
            Method: post
            Cors: '''*'''
  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowUpdateTask
      Handler: index.updateTaskController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks/{id}
            Method: put
            Cors: '''*'''
  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowDeleteTask
      Handler: index.deleteTaskController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks/{id}
            Method: delete
            Cors: '''*'''
  GetStacksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowGetStacks
      Handler: index.getStacksController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks
            Method: get
            Cors: '''*'''
  CreateStackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowCreateStack
      Handler: index.createStackController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks
            Method: post
            Cors: '''*'''
  UpdateStackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowUpdateStack
      Handler: index.updateStackController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks/{value}
            Method: put
            Cors: '''*'''
  DeleteStackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowDeleteStack
      Handler: index.deleteStackController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks/{value}
            Method: delete
            Cors: '''*'''
  GetEventTypesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowGetEventTypes
      Handler: index.getEventTypeController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types
            Method: get
            Cors: '''*'''
  CreateEventTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowCreateEventType
      Handler: index.createEventTypeController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types
            Method: post
            Cors: '''*'''
  UpdateEventTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowUpdateEventType
      Handler: index.updateEventTypeController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types/{value}
            Method: put
            Cors: '''*'''
  DeleteEventTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowDeleteEventType
      Handler: index.deleteEventTypeController
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types/{value}
            Method: delete
            Cors: '''*'''
Outputs:
  ApiGatewayInvokeURL:
    Description: Invoke URL for the TaskFlow API
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
