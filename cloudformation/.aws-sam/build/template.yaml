AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM template for TaskFlow API Gateway and Lambda functions.
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DynamoDBAccessPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
            Resource:
            - Fn::GetAtt:
              - ProfilesTable
              - Arn
            - Fn::GetAtt:
              - TasksTable
              - Arn
            - Fn::GetAtt:
              - StackTable
              - Arn
            - Fn::GetAtt:
              - EventTypeTable
              - Arn
            - Fn::Join:
              - ''
              - - Fn::GetAtt:
                  - ProfilesTable
                  - Arn
                - /index/*
            - Fn::Join:
              - ''
              - - Fn::GetAtt:
                  - TasksTable
                  - Arn
                - /index/*
      Path: /
Outputs:
  ApiGatewayInvokeURL:
    Description: Invoke URL for the TaskFlow API
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
