                      statusCode: 204, # No Content
                      headers: { <<: *CommonCORSHeaders },
                      body: ''
                  };
              } catch (error) {
                  console.error('Error deleting task:', error);
                  return {
                      statusCode: 500,
                      headers: { <<: *CommonCORSHeaders },
                      body: JSON.stringify({ message: 'Failed to delete task', error: error.message })
