AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM template for TaskFlow API Gateway and Lambda functions.

Resources:
  # IAM Role for Lambda functions to access DynamoDB
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole # For CloudWatch Logs
      Policies:
        - PolicyName: DynamoDBAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt ProfilesTable.Arn
                  - !GetAtt TasksTable.Arn
                  - !GetAtt StackTable.Arn
                  - !GetAtt EventTypeTable.Arn
                  - !Join ['', [!GetAtt ProfilesTable.Arn, '/index/*']] # For GSIs
                  - !Join ['', [!GetAtt TasksTable.Arn, '/index/*']] # For GSIs
      Path: /

  # Lambda Function to get all tasks
  GetTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowGetTasks
      Handler: getTasks.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks
            Method: get
            Cors: "'*'"

  # Lambda Function to create a task
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowCreateTask
      Handler: createTask.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks
            Method: post
            Cors: "'*'"

  # Lambda Function to update a task
  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowUpdateTask
      Handler: updateTask.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks/{id}
            Method: put
            Cors: "'*'"

  # Lambda Function to delete a task
  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowDeleteTask
      Handler: deleteTask.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tasks/{id}
            Method: delete
            Cors: "'*'"

  # Lambda Function to get all stacks
  GetStacksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowGetStacks
      Handler: getStacks.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks
            Method: get
            Cors: "'*'"

  # Lambda Function to create a stack
  CreateStackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowCreateStack
      Handler: createStack.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks
            Method: post
            Cors: "'*'"

  # Lambda Function to update a stack
  UpdateStackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowUpdateStack
      Handler: updateStack.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks/{value}
            Method: put
            Cors: "'*'"

  # Lambda Function to delete a stack
  DeleteStackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowDeleteStack
      Handler: deleteStack.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /stacks/{value}
            Method: delete
            Cors: "'*'"

  # Lambda Function to get all event types
  GetEventTypesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowGetEventTypes
      Handler: getEventTypes.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types
            Method: get
            Cors: "'*'"

  # Lambda Function to create an event type
  CreateEventTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowCreateEventType
      Handler: createEventType.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
