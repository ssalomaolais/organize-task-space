AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for TaskFlow API Gateway and Lambda functions.

Resources:
  # IAM Role for Lambda functions to access DynamoDB
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole # For CloudWatch Logs
      Policies:
        - PolicyName: DynamoDBAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt ProfilesTable.Arn
                  - !GetAtt TasksTable.Arn
                  - !GetAtt StackTable.Arn
                  - !GetAtt EventTypeTable.Arn
                  - !Join ['', [!GetAtt ProfilesTable.Arn, '/index/*']] # For GSIs
                  - !Join ['', [!GetAtt TasksTable.Arn, '/index/*']] # For GSIs
      Path: /

  # Lambda Function to get all tasks
  GetTasksLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TaskFlowGetTasks
      Handler: index.handler
      Runtime: nodejs20.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();

          exports.handler = async (event) => {
              console.log('Received event (GET /tasks):', JSON.stringify(event, null, 2));
              const params = {
                  TableName: 'tasks'
              };

              try {
                  const data = await dynamodb.scan(params).promise();
                  return {
                      statusCode: 200,
                      headers: {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Headers": "Content-Type",
                          "Access-Control-Allow-Methods": "OPTIONS,GET,POST,PUT,DELETE"
                      },
                      body: JSON.stringify(data.Items)
                  };
              } catch (error) {
                  console.error('Error fetching tasks:', error);
                  return {
                      statusCode: 500,
                      headers: {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Headers": "Content-Type",
                          "Access-Control-Allow-Methods": "OPTIONS,GET,POST,PUT,DELETE"
                      },
                      body: JSON.stringify({ message: 'Failed to fetch tasks', error: error.message })
                  };
              }
          };

  # Lambda Function to create a task
  CreateTaskLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TaskFlowCreateTask
      Handler: index.handler
      Runtime: nodejs20.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();
          const { v4: uuidv4 } = require('uuid'); // You'd need to include uuid in your Lambda layer or zip

          exports.handler = async (event) => {
              console.log('Received event (POST /tasks):', JSON.stringify(event, null, 2));
              try {
                  const taskData = JSON.parse(event.body);
                  const now = new Date().toISOString();
                  const newTask = {
                      id: uuidv4(), // Generate a unique ID
                      ...taskData,
                      created_at: now,
                      updated_at: now
                  };

                  const params = {
                      TableName: 'tasks',
                      Item: newTask
                  };

                  await dynamodb.put(params).promise();

                  return {
                      statusCode: 201,
                      headers: {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Headers": "Content-Type",
                          "Access-Control-Allow-Methods": "OPTIONS,GET,POST,PUT,DELETE"
                      },
                      body: JSON.stringify(newTask)
                  };
              } catch (error) {
                  console.error('Error creating task:', error);
                  return {
                      statusCode: 500,
                      headers: {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Headers": "Content-Type",
                          "Access-Control-Allow-Methods": "OPTIONS,GET,POST,PUT,DELETE"
                      },
                      body: JSON.stringify({ message: 'Failed to create task', error: error.message })
                  };
              }
          };

  # Lambda Function to update a task
  UpdateTaskLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TaskFlowUpdateTask
      Handler: index.handler
      Runtime: nodejs20.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();

          exports.handler = async (event) => {
              console.log('Received event (PUT /tasks/{id}):', JSON.stringify(event, null, 2));
              const taskId = event.pathParameters.id;
              try {
                  const updateData = JSON.parse(event.body);
                  const now = new Date().toISOString();

                  let UpdateExpression = 'set updated_at = :updatedAt';
                  let ExpressionAttributeValues = { ':updatedAt': now };
                  let ExpressionAttributeNames = {};

                  for (const key in updateData) {
                      if (updateData.hasOwnProperty(key) && key !== 'id' && key !== 'created_at') {
                          UpdateExpression += `, #${key} = :${key}`;
                          ExpressionAttributeValues[`:${key}`] = updateData[key];
                          ExpressionAttributeNames[`#${key}`] = key;
                      }
                  }

                  const params = {
                      TableName: 'tasks',
                      Key: { id: taskId },
                      UpdateExpression: UpdateExpression,
                      ExpressionAttributeValues: ExpressionAttributeValues,
                      ExpressionAttributeNames: Object.keys(ExpressionAttributeNames).length > 0 ? ExpressionAttributeNames : undefined,
                      ReturnValues: 'ALL_NEW'
                  };

                  const result = await dynamodb.update(params).promise();

                  return {
                      statusCode: 200,
                      headers: {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Headers": "Content-Type",
                          "Access-Control-Allow-Methods": "OPTIONS,GET,POST,PUT,DELETE"
                      },
                      body: JSON.stringify(result.Attributes)
                  };
              } catch (error) {
                  console.error('Error updating task:', error);
                  return {
                      statusCode: 500,
                      headers: {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Headers": "Content-Type",
                          "Access-Control-Allow-Methods": "OPTIONS,GET,POST,PUT,DELETE"
                      },
                      body: JSON.stringify({ message: 'Failed to update task', error: error.message })
                  };
              }
          };

  # Lambda Function to delete a task
  DeleteTaskLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TaskFlowDeleteTask
      Handler: index.handler
      Runtime: nodejs20.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();

          exports.handler = async (event) => {
              console.log('Received event (DELETE /tasks/{id}):', JSON.stringify(event, null, 2));
              const taskId = event.pathParameters.id;

              const params = {
                  TableName: 'tasks',
                  Key: { id: taskId }
              };

              try {
                  await dynamodb.delete(params).promise();
                  return {
                      statusCode: 204, // No Content
                      headers: {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Headers": "Content-Type",
                          "Access-Control-Allow-Methods": "OPTIONS,GET,POST,PUT,DELETE"
                      },
                      body: ''
                  };
              } catch (error) {
                  console.error('Error deleting task:', error);
                  return {
                      statusCode: 500,
                      headers: {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Headers": "Content-Type",
                          "Access-Control-Allow-Methods": "OPTIONS,GET,POST,PUT,DELETE"
                      },
                      body: JSON.stringify({ message: 'Failed to delete task', error: error.message })
                  };
              }
          };

  # API Gateway REST API
  TaskFlowApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: TaskFlowAPI
      Description: API for TaskFlow application
      CorsConfiguration:
        AllowOrigins:
          - '*' # Adjust this to your frontend URL in production
        AllowHeaders:
          - 'Content-Type'
          - 'X-Amz-Date'
          - 'Authorization'
          - 'X-Api-Key'
          - 'X-Amz-Security-Token'
        AllowMethods:
          - 'GET'
          - 'POST'
          - 'PUT'
          - 'DELETE'
          - 'OPTIONS'

  # API Gateway Resource for /tasks
  TasksResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt TaskFlowApi.RootResourceId
      PathPart: tasks
      RestApiId: !Ref TaskFlowApi

  # API Gateway Resource for /tasks/{id}
  TaskByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref TasksResource
      PathPart: '{id}'
      RestApiId: !Ref TaskFlowApi

  # API Gateway GET method for /tasks (already exists, updated CORS)
  GetTasksMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: GET
      ResourceId: !Ref TasksResource
      RestApiId: !Ref TaskFlowApi
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetTasksLambda.Arn}/invocations"
        PassthroughBehavior: WHEN_NO_MATCH
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: "Empty"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  # API Gateway POST method for /tasks
  CreateTaskMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: POST
      ResourceId: !Ref TasksResource
      RestApiId: !Ref TaskFlowApi
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTaskLambda.Arn}/invocations"
        PassthroughBehavior: WHEN_NO_MATCH
      MethodResponses:
        - StatusCode: 201
          ResponseModels:
            application/json: "Empty"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  # API Gateway PUT method for /tasks/{id}
  UpdateTaskMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: PUT
      ResourceId: !Ref TaskByIdResource
      RestApiId: !Ref TaskFlowApi
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateTaskLambda.Arn}/invocations"
        PassthroughBehavior: WHEN_NO_MATCH
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: "Empty"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  # API Gateway DELETE method for /tasks/{id}
  DeleteTaskMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: DELETE
      ResourceId: !Ref TaskByIdResource
      RestApiId: !Ref TaskFlowApi
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteTaskLambda.Arn}/invocations"
        PassthroughBehavior: WHEN_NO_MATCH
      MethodResponses:
        - StatusCode: 204
          ResponseModels:
            application/json: "Empty"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  # API Gateway OPTIONS method for CORS preflight on /tasks
  OptionsTasksMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: OPTIONS
      ResourceId: !Ref TasksResource
      RestApiId: !Ref TaskFlowApi
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: "{\"statusCode\": 200}"
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: "{}"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # API Gateway OPTIONS method for CORS preflight on /tasks/{id}
  OptionsTaskByIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: OPTIONS
      ResourceId: !Ref TaskByIdResource
      RestApiId: !Ref TaskFlowApi
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: "{\"statusCode\": 200}"
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: "{}"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetTasksMethod
      - CreateTaskMethod
      - UpdateTaskMethod
      - DeleteTaskMethod
      - OptionsTasksMethod
      - OptionsTaskByIdMethod
    Properties:
      RestApiId: !Ref TaskFlowApi
      Description: Deployment with full Task CRUD operations

  # API Gateway Stage
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: prod
      Description: Production Stage
      RestApiId: !Ref TaskFlowApi
      DeploymentId: !Ref ApiDeployment

  # Permissions for API Gateway to invoke Lambdas
  LambdaPermissionGetTasks:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt GetTasksLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TaskFlowApi.RootResourceId}/*"

  LambdaPermissionCreateTask:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CreateTaskLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TaskFlowApi.RootResourceId}/*"

  LambdaPermissionUpdateTask:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt UpdateTaskLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TaskFlowApi.RootResourceId}/*"

  LambdaPermissionDeleteTask:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt DeleteTaskLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TaskFlowApi.RootResourceId}/*"

Outputs:
  ApiGatewayInvokeURL:
    Description: "Invoke URL for the TaskFlow API"
    Value: !Sub "https://${TaskFlowApi}.execute-api.${AWS::Region}.amazonaws.com/prod"