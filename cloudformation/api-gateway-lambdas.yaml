AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for TaskFlow API Gateway and Lambda functions.

# Define reusable YAML anchors
x-LambdaDefaults: &LambdaDefaults
  Runtime: nodejs20.x
  Timeout: 30
  MemorySize: 128
  Role: !GetAtt LambdaExecutionRole.Arn

x-CommonCORSHeaders: &CommonCORSHeaders
  "Access-Control-Allow-Origin": "*"
  "Access-Control-Allow-Headers": "Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token"
  "Access-Control-Allow-Methods": "OPTIONS,GET,POST,PUT,DELETE"

x-LambdaProxyIntegration: &LambdaProxyIntegration
  Type: AWS_PROXY
  IntegrationHttpMethod: POST
  PassthroughBehavior: WHEN_NO_MATCH

x-ApiGatewayMethodResponses: &ApiGatewayMethodResponses
  - StatusCode: 200
    ResponseModels:
      application/json: "Empty"
    ResponseParameters:
      method.response.header.Access-Control-Allow-Origin: true
      method.response.header.Access-Control-Allow-Headers: true
      method.response.header.Access-Control-Allow-Methods: true

x-ApiGatewayOptionsIntegrationResponse: &ApiGatewayOptionsIntegrationResponse
  - StatusCode: 200
    ResponseParameters:
      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      method.response.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"
      method.response.header.Access-Control-Allow-Origin: "'*'"
    ResponseTemplates:
      application/json: "{}"

Resources:
  # IAM Role for Lambda functions to access DynamoDB
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole # For CloudWatch Logs
      Policies:
        - PolicyName: DynamoDBAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt ProfilesTable.Arn
                  - !GetAtt TasksTable.Arn
                  - !GetAtt StackTable.Arn
                  - !GetAtt EventTypeTable.Arn
                  - !Join ['', [!GetAtt ProfilesTable.Arn, '/index/*']] # For GSIs
                  - !Join ['', [!GetAtt TasksTable.Arn, '/index/*']] # For GSIs
      Path: /

  # Lambda Function to get all tasks
  GetTasksLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TaskFlowGetTasks
      <<: *LambdaDefaults # Apply common Lambda properties
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();

          exports.handler = async (event) => {
              console.log('Received event (GET /tasks):', JSON.stringify(event, null, 2));
              const params = {
                  TableName: 'tasks'
              };

              try {
                  const data = await dynamodb.scan(params).promise();
                  return {
                      statusCode: 200,
                      headers: { <<: *CommonCORSHeaders },
                      body: JSON.stringify(data.Items)
                  };
              } catch (error) {
                  console.error('Error fetching tasks:', error);
                  return {
                      statusCode: 500,
                      headers: { <<: *CommonCORSHeaders },
                      body: JSON.stringify({ message: 'Failed to fetch tasks', error: error.message })
                  };
              }
          };

  # Lambda Function to create a task
  CreateTaskLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TaskFlowCreateTask
      <<: *LambdaDefaults
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();
          const { v4: uuidv4 } = require('uuid'); // You'd need to include uuid in your Lambda layer or zip

          exports.handler = async (event) => {
              console.log('Received event (POST /tasks):', JSON.stringify(event, null, 2));
              try {
                  const taskData = JSON.parse(event.body);
                  const now = new Date().toISOString();
                  const newTask = {
                      id: uuidv4(), // Generate a unique ID
                      ...taskData,
                      created_at: now,
                      updated_at: now
                  };

                  const params = {
                      TableName: 'tasks',
                      Item: newTask
                  };

                  await dynamodb.put(params).promise();

                  return {
                      statusCode: 201,
                      headers: { <<: *CommonCORSHeaders },
                      body: JSON.stringify(newTask)
                  };
              } catch (error) {
                  console.error('Error creating task:', error);
                  return {
                      statusCode: 500,
                      headers: { <<: *CommonCORSHeaders },
                      body: JSON.stringify({ message: 'Failed to create task', error: error.message })
                  };
              }
          };

  # Lambda Function to update a task
  UpdateTaskLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TaskFlowUpdateTask
      <<: *LambdaDefaults
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();

          exports.handler = async (event) => {
              console.log('Received event (PUT /tasks/{id}):', JSON.stringify(event, null, 2));
              const taskId = event.pathParameters.id;
              try {
                  const updateData = JSON.parse(event.body);
                  const now = new Date().toISOString();

                  let UpdateExpression = 'set updated_at = :updatedAt';
                  let ExpressionAttributeValues = { ':updatedAt': now };
                  let ExpressionAttributeNames = {};

                  for (const key in updateData) {
                      if (updateData.hasOwnProperty(key) && key !== 'id' && key !== 'created_at') {
                          UpdateExpression += `, #${key} = :${key}`;
                          ExpressionAttributeValues[`:${key}`] = updateData[key];
                          ExpressionAttributeNames[`#${key}`] = key;
                      }
                  }

                  const params = {
                      TableName: 'tasks',
                      Key: { id: taskId },
                      UpdateExpression: UpdateExpression,
                      ExpressionAttributeValues: ExpressionAttributeValues,
                      ExpressionAttributeNames: Object.keys(ExpressionAttributeNames).length > 0 ? ExpressionAttributeNames : undefined,
                      ReturnValues: 'ALL_NEW'
                  };

                  const result = await dynamodb.update(params).promise();

                  return {
                      statusCode: 200,
                      headers: { <<: *CommonCORSHeaders },
                      body: JSON.stringify(result.Attributes)
                  };
              } catch (error) {
                  console.error('Error updating task:', error);
                  return {
                      statusCode: 500,
                      headers: { <<: *CommonCORSHeaders },
                      body: JSON.stringify({ message: 'Failed to update task', error: error.message })
                  };
              }
          };

