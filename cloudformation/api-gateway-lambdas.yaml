  # Lambda Function to update an event type
  UpdateEventTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowUpdateEventType
      Handler: updateEventType.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types/{value}
            Method: put
            Cors: "'*'"

  # Lambda Function to delete an event type
  DeleteEventTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskFlowDeleteEventType
      Handler: deleteEventType.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: s3://YOUR_S3_BUCKET_NAME/YOUR_S3_KEY_PREFIX/taskflow-lambdas.zip # REPLACE THIS
      Events:
        Api:
          Type: Api
          Properties:
            Path: /event-types/{value}
            Method: delete
            Cors: "'*'"

Outputs:
  ApiGatewayInvokeURL:
    Description: "Invoke URL for the TaskFlow API"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"